{% extends "base.html" %}
{% block title %}New Bill | Iread{% endblock %}
{% block content %}

<!-- ── TOP BAR STATS ── -->
<div class="pos-topbar">
  <div class="pos-brand-mini">
    <span class="pos-dot"></span>
    <span>New Bill</span>
  </div>
  <div class="pos-stats">
    <div><span>Today</span><strong>{{ today_count }} bills</strong></div>
    <div><span>Sales</span><strong>{{ today_total|inr }}</strong></div>
  </div>
</div>

<!-- ── SERVICE TILE GRID ── -->
<div class="pos-layout">
  <div class="pos-services" id="servicePanel">

    <!-- Category filter tabs -->
    <div class="cat-tabs" id="catTabs">
      <button class="cat-tab active" data-cat="all">All</button>
      <button class="cat-tab" data-cat="bw">B&amp;W</button>
      <button class="cat-tab" data-cat="color">Colour</button>
      <button class="cat-tab" data-cat="photo">Photo</button>
      <button class="cat-tab" data-cat="service">Services</button>
      <button type="button" class="cat-tab custom-add" id="addCustomItemBtn">+ Custom Item</button>
    </div>

    <!-- Tiles -->
    <div class="tile-grid" id="tileGrid">
      {% for s in services %}
      <button type="button"
        class="tile"
        data-id="{{ s.id }}"
        data-name="{{ s.name }}"
        data-rate="{{ s.rate }}"
        data-type="{{ s.print_type }}"
        data-size="{{ s.paper_size }}"
        data-cat="{{ s.print_type }}">
        <span class="tile-badge {{ s.print_type }}">{{ s.print_type | upper }}</span>
        <span class="tile-name">{{ s.name }}</span>
        <span class="tile-rate">{{ s.rate | inr }}</span>
      </button>
      {% endfor %}
    </div>

  </div>

  <!-- ── CART PANEL ── -->
  <div class="pos-cart" id="cartPanel">
    <div class="cart-header">
      <span class="cart-title">🛒 Bill</span>
      <div class="cart-meta-row">
        <select name="payment_method" id="pmMethod" class="cart-select">
          <option>Cash</option><option>UPI</option><option>Card</option>
          <option>Credit</option><option>Other</option>
        </select>
        <input class="cart-input-sm" type="text" id="pmCustomer" placeholder="Customer (optional)">
      </div>
    </div>

    <div class="cart-items" id="cartItems">
      <div class="cart-empty" id="cartEmpty">Tap a service to add it →</div>
    </div>

    <div class="cart-footer">
      <div class="cart-totals">
        <div><span>Subtotal</span><strong id="cSubtotal">₹0.00</strong></div>
        <div>
          <label for="cDiscount">Discount ₹</label>
          <input id="cDiscount" class="cart-input-num" type="number" min="0" step="0.01" value="0">
        </div>
        <div class="cart-grand"><span>Total</span><strong id="cTotal">₹0.00</strong></div>
        <div>
          <label for="cPaid">Received ₹</label>
          <input id="cPaid" class="cart-input-num" type="number" min="0" step="0.01" placeholder="Full">
        </div>
      </div>
      <button class="pos-submit-btn" id="submitBillBtn" disabled>Save &amp; Print Receipt</button>
    </div>
  </div>
</div>

<!-- ── HIDDEN FORM (submitted programmatically) ── -->
<form method="post" action="{{ url_for('create_bill') }}" id="billForm" style="display:none">
  <input name="customer" id="fCustomer">
  <input name="payment_method" id="fPayment">
  <input name="discount" id="fDiscount">
  <input name="paid" id="fPaid">
  <input name="notes" id="fNotes" value="">
  <div id="fItems"></div>
</form>

<!-- ── ITEM EDITOR MODAL ── -->
<div class="modal-backdrop" id="modalBackdrop"></div>
<div class="item-modal" id="itemModal" role="dialog" aria-modal="true">
  <div class="modal-drag-bar"></div>
  <div class="modal-header">
    <div style="flex:1; margin-right:12px;">
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
        <span class="modal-badge" id="mBadge"></span>
        <select id="mCategory" class="modal-cat-select" style="display:none;">
          <option value="bw">B&amp;W</option>
          <option value="color">Colour</option>
          <option value="photo">Photo</option>
          <option value="service" selected>Service</option>
        </select>
      </div>
      <input id="mName" class="modal-title-input" type="text" placeholder="Item / Service name" required>
    </div>
    <button class="modal-close" id="modalClose" aria-label="Close">×</button>
  </div>

  <div class="modal-fields">
    <div class="mf-row">
      <div class="mf-group">
        <label>Copies</label>
        <div class="stepper">
          <button type="button" class="step-btn" data-target="mQty" data-delta="-1">−</button>
          <input id="mQty" class="step-input" type="number" min="1" value="1">
          <button type="button" class="step-btn" data-target="mQty" data-delta="1">+</button>
        </div>
      </div>
      <div class="mf-group">
        <label>Pages / copy</label>
        <div class="stepper">
          <button type="button" class="step-btn" data-target="mPages" data-delta="-1">−</button>
          <input id="mPages" class="step-input" type="number" min="1" value="1">
          <button type="button" class="step-btn" data-target="mPages" data-delta="1">+</button>
        </div>
      </div>
    </div>
    <div class="mf-row">
      <div class="mf-group">
        <label>Sides</label>
        <div class="seg-ctrl" id="sidesCtrl">
          <button type="button" class="seg-btn active" data-val="Single">Single</button>
          <button type="button" class="seg-btn" data-val="Double-sided">Double</button>
        </div>
      </div>
      <div class="mf-group">
        <label>Rate / page (₹)</label>
        <input id="mRate" class="modal-rate-input" type="number" min="0" step="0.01">
      </div>
    </div>
    <div class="modal-line-total">
      Amount: <strong id="mAmount">₹0.00</strong>
    </div>
  </div>

  <div class="modal-actions">
    <button type="button" class="pos-btn secondary" id="modalCancel">Cancel</button>
    <button type="button" class="pos-btn primary" id="modalAdd">Add to Bill</button>
  </div>
</div>

<script>
/* ─────────── State ─────────── */
let cart = [];          // [{id,name,rate,type,size,qty,pages,sides,lineTotal}]
let editingIdx = null;  // index of cart item being edited (null = new)
let activeTile = null;

/* ─────────── Category filter ─────────── */
document.getElementById('catTabs').addEventListener('click', e => {
  const btn = e.target.closest('.cat-tab');
  if (!btn) return;
  document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const cat = btn.dataset.cat;
  document.querySelectorAll('.tile').forEach(t => {
    t.style.display = (cat === 'all' || t.dataset.cat === cat) ? '' : 'none';
  });
});

/* ─────────── Tile tap → open modal ─────────── */
document.getElementById('tileGrid').addEventListener('click', e => {
  const tile = e.target.closest('.tile');
  if (!tile) return;
  activeTile = tile;
  editingIdx = null;
  openModal({
    id: tile.dataset.id,
    name: tile.dataset.name,
    rate: parseFloat(tile.dataset.rate),
    type: tile.dataset.type,
    size: tile.dataset.size,
    qty: 1, pages: 1, sides: 'Single'
  });
});

/* ─────────── Custom item button ─────────── */
const addCustomBtn = document.getElementById('addCustomItemBtn');
if (addCustomBtn) {
  addCustomBtn.addEventListener('click', () => {
    activeTile = null;
    editingIdx = null;
    openModal({
      id: 'custom',
      name: '',
      rate: 0,
      type: 'service',
      size: '-',
      qty: 1, pages: 1, sides: 'Single'
    });
  });
}

/* ─────────── Modal open/close ─────────── */
function openModal(item) {
  const isCustom = item.id === 'custom' || !item.id;
  const mCategory = document.getElementById('mCategory');
  const mBadge = document.getElementById('mBadge');
  if (isCustom) {
    mBadge.style.display = 'none';
    mCategory.style.display = 'inline-block';
    mCategory.value = item.type || 'service';
  } else {
    mCategory.style.display = 'none';
    mBadge.style.display = 'inline-block';
    mBadge.textContent = (item.type || 'BW').toUpperCase();
    mBadge.className = 'modal-badge ' + (item.type || 'bw');
  }
  document.getElementById('mName').value = item.name || '';
  document.getElementById('mQty').value = item.qty || 1;
  document.getElementById('mPages').value = item.pages || 1;
  document.getElementById('mRate').value = item.rate !== undefined ? item.rate : 0;
  setSides(item.sides || 'Single');
  updateModalAmount();
  document.getElementById('itemModal').classList.add('open');
  document.getElementById('modalBackdrop').classList.add('open');
  document.getElementById('modalAdd').textContent = editingIdx !== null ? 'Update' : 'Add to Bill';
  setTimeout(() => document.getElementById('mName').focus(), 100);
}

function closeModal() {
  document.getElementById('itemModal').classList.remove('open');
  document.getElementById('modalBackdrop').classList.remove('open');
  editingIdx = null;
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalCancel').addEventListener('click', closeModal);
document.getElementById('modalBackdrop').addEventListener('click', closeModal);

/* ─────────── Sides segmented control ─────────── */
function setSides(val) {
  document.querySelectorAll('.seg-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.val === val);
  });
}
document.getElementById('sidesCtrl').addEventListener('click', e => {
  const btn = e.target.closest('.seg-btn');
  if (!btn) return;
  setSides(btn.dataset.val);
  updateModalAmount();
});

/* ─────────── Stepper buttons ─────────── */
document.querySelectorAll('.step-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const inp = document.getElementById(btn.dataset.target);
    inp.value = Math.max(1, (parseInt(inp.value) || 1) + parseInt(btn.dataset.delta));
    updateModalAmount();
  });
});

['mQty','mPages','mRate'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateModalAmount);
});

function updateModalAmount() {
  const qty = Math.max(1, parseInt(document.getElementById('mQty').value) || 1);
  const pages = Math.max(1, parseInt(document.getElementById('mPages').value) || 1);
  const rate = parseFloat(document.getElementById('mRate').value) || 0;
  const total = qty * pages * rate;
  document.getElementById('mAmount').textContent = fmt(total);
}

/* ─────────── Add / Update cart ─────────── */
document.getElementById('modalAdd').addEventListener('click', () => {
  const name  = document.getElementById('mName').value.trim() || (activeTile ? activeTile.dataset.name : 'Custom Item');
  const qty   = Math.max(1, parseInt(document.getElementById('mQty').value) || 1);
  const pages = Math.max(1, parseInt(document.getElementById('mPages').value) || 1);
  const rate  = parseFloat(document.getElementById('mRate').value) || 0;
  const sides = document.querySelector('.seg-btn.active')?.dataset.val || 'Single';
  const type  = activeTile ? activeTile.dataset.type : (document.getElementById('mCategory').value || 'service');
  const size  = activeTile ? activeTile.dataset.size : '-';
  const id    = activeTile ? activeTile.dataset.id : 'custom';
  const lineTotal = qty * pages * rate;

  if (editingIdx !== null) {
    cart[editingIdx] = { ...cart[editingIdx], name, type, size, qty, pages, rate, sides, lineTotal };
  } else {
    cart.push({ id, name, type, size, qty, pages, rate, sides, lineTotal });
  }
  closeModal();
  renderCart();
});

/* ─────────── Cart render ─────────── */
function renderCart() {
  const el = document.getElementById('cartItems');
  const empty = document.getElementById('cartEmpty');
  if (cart.length === 0) {
    el.innerHTML = '';
    el.appendChild(empty);
    document.getElementById('submitBillBtn').disabled = true;
    recalc();
    return;
  }
  empty.remove();
  el.innerHTML = '';
  cart.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'cart-item';
    div.innerHTML = `
      <div class="ci-info" data-idx="${idx}">
        <span class="ci-badge ${item.type}">${item.type.toUpperCase()}</span>
        <div class="ci-detail">
          <span class="ci-name">${item.name}</span>
          <span class="ci-meta">${item.qty} × ${item.pages}p × ₹${item.rate} · ${item.sides}</span>
        </div>
      </div>
      <div class="ci-right">
        <span class="ci-total">${fmt(item.lineTotal)}</span>
        <button class="ci-del" data-idx="${idx}" aria-label="Remove">✕</button>
      </div>`;
    el.appendChild(div);
  });
  document.getElementById('submitBillBtn').disabled = false;
  recalc();

  // Edit on tap
  el.querySelectorAll('.ci-info').forEach(row => {
    row.addEventListener('click', () => {
      editingIdx = parseInt(row.dataset.idx);
      const item = cart[editingIdx];
      activeTile = item.id !== 'custom' ? document.querySelector(`.tile[data-id="${item.id}"]`) : null;
      openModal(item);
    });
  });
  // Delete
  el.querySelectorAll('.ci-del').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      cart.splice(parseInt(btn.dataset.idx), 1);
      renderCart();
    });
  });
}

/* ─────────── Recalc totals ─────────── */
function recalc() {
  const subtotal = cart.reduce((s, i) => s + i.lineTotal, 0);
  const disc = Math.min(subtotal, Math.max(0, parseFloat(document.getElementById('cDiscount').value) || 0));
  document.getElementById('cSubtotal').textContent = fmt(subtotal);
  document.getElementById('cTotal').textContent = fmt(subtotal - disc);
}
document.getElementById('cDiscount').addEventListener('input', recalc);

/* ─────────── Submit ─────────── */
document.getElementById('submitBillBtn').addEventListener('click', () => {
  const fItems = document.getElementById('fItems');
  fItems.innerHTML = '';
  cart.forEach(item => {
    const h = (n,v) => { const i=document.createElement('input'); i.type='hidden'; i.name=n; i.value=v; fItems.appendChild(i); };
    h('item_service[]', item.id);
    h('item_name[]',    item.name);
    h('item_qty[]',     item.qty);
    h('item_pages[]',   item.pages);
    h('item_sides[]',   item.sides);
    h('item_rate[]',    item.rate);
    h('item_type[]',    item.type);
    h('item_size[]',    item.size);
  });
  document.getElementById('fCustomer').value = document.getElementById('pmCustomer').value;
  document.getElementById('fPayment').value  = document.getElementById('pmMethod').value;
  document.getElementById('fDiscount').value = document.getElementById('cDiscount').value || 0;
  const paid = document.getElementById('cPaid').value;
  document.getElementById('fPaid').value = paid || '';
  document.getElementById('billForm').submit();
});

/* ─────────── Helpers ─────────── */
function fmt(n) {
  return '₹' + Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
}
</script>
{% endblock %}
